               M 178.413 22.786 C 178.413 16.711 174.802 13.066 168.794 13.066 C 163.327 13.066 159.58 17.184 159.58 22.786 C 159.58 28.76 163.124 32.473 168.997 32.473 C 174.869 32.473 178.413 28.692 178.413 22.786 Z M 164.373 22.854 C 164.373 18.77 165.993 16.677 168.997 16.677 C 171.967 16.677 173.587 18.871 173.587 22.854 C 173.587 26.802 171.967 28.996 168.997 28.996 C 165.993 28.996 164.373 26.802 164.373 22.854 Z
