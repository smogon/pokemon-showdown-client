               M 290.493 -26.029 L 282.893 -26.029 L 282.893 -12.492 L 272.681 -26.029 L 264.274 -26.029 L 264.274 0 L 271.826 0 L 271.826 -13.965 L 282.418 0 L 290.493 0 L 290.493 -26.029 Z" />
    </g>
  </defs>

  <g filter="url(#dropShadow)">
    <use href="#markShape" fill="url(#mark)" filter="url(#innerShadows)" />
    <use href="#markShape" fill="none" stroke="#cee4f5" stroke-width="2" stroke-linejoin="round" />
  </g>
  <g filter="url(#dropShadow)">
    <!-- The fills cover half the stroke, leaving a 2px outer outline. -->
    <use href="#lettering" fill="none" stroke="#cee4f5" stroke-width="4" stroke-linejoin="round" />
    <g filter="url(#textInnerShadows)">
      <use href="#pokemonText" fill="url(#pokemon)" />
      <use href="#showdownText" fill="url(#showdown)" />
    </g>
  </g>
  <g id="betaBadge" filter="url(#dropShadow)">
    <rect x="191" y="62" width="51" height="19" rx="9.5"
          fill="#3b4d62" stroke="#e0ecf3" stroke-width="2" />
    <!-- Eleven-pixel capitals, fitted independently of the six-pixel 1× badge. -->
    <g fill="#e0ecf3" fill-rule="evenodd" transform="translate(198 66)">
      <!-- B -->
      <path d="M 0 0 H 4.5 Q 8.5 0 8.5 3 Q 8.5 4.4 6.6 5
               Q 9 5.5 9 8 Q 9 11 4.8 11 H 0 Z
               M 2 2 V 4 H 4.6 Q 6 4 6 3 T 4.6 2 Z
               M 2 6 V 9 H 4.8 Q 6.5 9 6.5 7.5 T 4.8 6 Z" />
      <!-- E -->
      <path transform="translate(11 0)" d="M 0 0 H 8 V 2 H 2 V 4 H 7 V 6 H 2 V 9 H 8 V 11 H 0 Z" />
      <!-- T -->
      <path transform="translate(20 0)" d="M 0 0 H 9 V 2 H 6 V 11 H 3 V 2 H 0 Z" />
      <!-- A -->
      <path transform="translate(28 0)" d="M 0 11 L 4 0 H 6 L 10 11 H 7.5 L 6.8 9 H 3.2 L 2.5 11 Z
                                           M 3.8 7 H 6.2 L 5 3 Z" />
    </g>
  </g>
</svg>
