# This workflow will do an install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run test
      env:
        CI: true
    - name: Check out server for full-test
      uses: actions/checkout@v6
      with:
        repository: smogon/pokemon-showdown
        path: caches/pokemon-showdown
    - run: npm ci
      working-directory: caches/pokemon-showdown
    - run: npm run full-test -- --no-update
      env:
        CI: true
